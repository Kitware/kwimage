[build-system]
requires = [ "setuptools>=41.0.1", "wheel>=0.37.1",]

[tool.xcookie]
tags = [ "purepy", "gitlab", "kitware", "cv2", "gdal"]
mod_name = "kwimage"
author = 'Jon Crall'
author_email = 'jon.crall@kitware.com'
repo_name = "kwimage"
#ci_cpython_versions = ['3.8', '3.9', '3.10', '3.11', '3.12']
min_python = "3.9"
max_python = "3.14"
url = 'https://gitlab.kitware.com/computer-vision/kwimage'
dev_status = "beta"
typed = true
render_doc_images = 1
classifiers = [
    "Development Status :: 4 - Beta",
    'Intended Audience :: Developers',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development',
    'Topic :: Software Development :: Libraries :: Python Modules',
    'Topic :: Utilities',
    # This should be interpreted as Apache License v2.0
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[tool.xcookie.entry_points]
console_scripts = [
    "kwimage = kwimage.cli.__main__:main",
]

[tool.pytest.ini_options]
addopts = "-p no:doctest --xdoctest --xdoctest-style=google --ignore-glob=setup.py"
norecursedirs = ".git ignore build __pycache__ dev docs _skbuild"
filterwarnings = [ "default", "ignore:.*No cfgstr given in Cacher constructor or call.*:Warning", "ignore:.*Define the __nice__ method for.*:Warning", "ignore:.*private pytest class or function.*:Warning",]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", ".*  # pragma: no cover", ".*  # nocover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if 0:", "if trace is not None", "verbose = .*", "^ *raise", "^ *pass *$", "if _debug:", "if __name__ == .__main__.:", ".*if six.PY2:",]
omit = [ "kwimage/__main__.py", "*/setup.py",]


[tool.ruff]
line-length = 80
target-version = "py38"

[tool.ruff.lint]
# Enable Flake8 (E, F) and isort (I) rules.
select = ["E", "F", "I"]
# Ignore specific rules, for example, E501 (line too long) as it's handled by the formatter.
ignore = [
    "E501",  # line too long
    "E402",  # Module level import not at top of file
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
unresolved-import = "ignore"

[tool.ty.src]
include = ["kwimage"]

[[tool.ty.overrides]]
include = [
    "kwimage/algo/algo_nms.py",
    "kwimage/transform.py",
    "kwimage/structs/boxes.py",
    "kwimage/im_demodata.py",
    "kwimage/im_cv2.py",
    "kwimage/im_draw.py",
    "kwimage/structs/polygon.py",
    "kwimage/structs/mask.py",
    "kwimage/structs/coords.py",
    "kwimage/structs/segmentation.py",
    "kwimage/im_io.py",
    "kwimage/im_core.py",
    "kwimage/structs/points.py",
    "kwimage/im_filter.py",
    "kwimage/im_runlen.py",
    "kwimage/im_stack.py",
    "kwimage/cli/crop_border.py",
    "kwimage/cli/stack_images.py",
    "kwimage/im_alphablend.py",
    "kwimage/cli/__main__.py",
    "kwimage/im_transform.py",
]

[tool.ty.overrides.rules]
all = "ignore"

[tool.mypy]
ignore_missing_imports = true
